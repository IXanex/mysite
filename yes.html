<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Даааааа!!!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFB6C1; /* нежно-розовый, как на главной */
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .gif-container {
      margin-bottom: 20px;
    }

    .gif-container img {
      max-width: 250px;
      max-height: 250px;
      border-radius: 12px;
    }

    h1 {
      font-size: 24px;
      color: #fff;
      margin: 10px 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    p {
      color: #fff;
      margin: 6px 0;
      font-size: 16px;
    }

    /* скрытый текст: невидим, пока не выделишь */
    .hidden-text {
      color: transparent;
      background: transparent;
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      cursor: pointer;
      transition: color 0.3s ease;
      max-width: 520px;
      line-height: 1.5;
      font-size: 16px;
    }

    .hidden-text::selection {
      color: #000;
      background: #fff;
    }
    .hidden-text::-moz-selection {
      color: #000;
      background: #fff;
    }

    /* клик — текст становится видимым */
    .hidden-text.revealed {
      color: #000;
    }

    .hint {
      font-size: 13px;
      color: #fff;
      opacity: 0.7;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="gif-container">
    <img src="https://i.postimg.cc/RVFpK1WN/image.gif" alt="GIF-изображение">
  </div>

  <p class="hidden-text" id="secret">
    Люблю тебя всю, от пяточек до макушки, я не знаю скажу ли я это тебе когда мы будем рядом, надеюсь у меня хватит смелости. А так я оставлю это тут, на случай если я не решусь сказать это лично в глаза, буду стараться завалить тебя поцелуями, показать свою любовь как я это умею! &lt;3
  </p>

  <script>
    const secret = document.getElementById('secret');
    secret.addEventListener('click', () => {
      secret.classList.toggle('revealed');
    });
  </script>
</body>
</html>
