<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Ссылки</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./yes_style.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      font-family: sans-serif; /* Добавим шрифт по умолчанию */
    }
    .gif-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px; /* Отступ снизу для GIF */
    }
    img {
      max-width: 250px;
      max-height: 250px;
    }
    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .info-container p {
      color: #FFB6C1; /* Розовый цвет для текста */
      margin: 5px 0; /* Отступы между параграфами */
    }
    .box {
      position: absolute;
      background-color: #FFB6C1;
      padding: 10px;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      width: 150px; /* Увеличим ширину кнопок */
      height: 50px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .top-left {
      top: 20px;
      left: 20px;
    }
    .top-right {
      top: 20px;
      right: 20px;
    }
    .bottom-left {
      bottom: 20px;
      left: 20px;
    }
    .bottom-right {
      bottom: 20px;
      right: 20px;
    }
    .box:hover {
      opacity: 0.8;
    }
    h1 {
      font-size: 20px; /* Размер заголовка */
      color: #FFB6C1; /* Цвет заголовка */
      margin-bottom: 20px; /* Отступ снизу */
    }
  </style>
</head>
<body>
  <h1>Даааааа!!!</h1>
  <div class="gif-container">
    <img src="https://i.postimg.cc/RVFpK1WN/image.gif" alt="GIF-изображение">
  </div>
</body>
</html>
