<!DOCTYPE html>
<html lang="ru">
 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <head>
         <title>Приветик</title>
        <link href="./styles.css" rel="stylesheet"/>
    </head> 
    <body><div class="container">
<div>
<h1 class="header_text">Ты миленькая?</h1>
</div>

<div class="gif_container"><img src="https://i.postimg.cc/CKfWDG6j/first.gif" /></div>

<div class="buttons"><button class="btn" id="yesButton" onclick="nextPage()">ДА</button><button class="btn" id="noButton" onclick="moveButton()" onmouseover="moveButton()">Нет</button><script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }

                    function moveButton() {
                        var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth);
                        var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight);
                        document.getElementById('noButton').style.left = `${x}px`;
                        document.getElementById('noButton').style.top = `${y}px`;
                    }
                </script>
</div>
</body>
</html>
